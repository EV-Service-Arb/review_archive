[package]
name = "review_archive"
description = "Archive of public place reviews: an AVIF screenshot of every review as it first appears, plus structured data for statistics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.cargo-machete]
ignored = ["clap", "kamadak-exif", "tracing-error"] # clap: v_utils' settings derive emits it; kamadak-exif: its lib is `exif`

[features]
default = ["maps", "store"]
# Google in a headless Chromium: the `Browser` handle, the `maps` source, and the `gbp`
# source (Business Profiles through the official API, screenshots from the Maps page).
maps = ["dep:browser_manipulation", "dep:futures", "dep:playwright-rs"]
# the config sections as v_utils `Settings` sections
settings = ["dep:clap", "dep:schemars", "v_utils/cli", "review_archive_core/settings"]
# SQLite + content-addressed WebPs under a data dir, runs, stats, export, webhooks.
store = [
    "dep:futures",
    "dep:hmac",
    "dep:sa_alerts",
    "dep:sa_places",
    "dep:sqlx",
    "dep:tempfile",
    "dep:uuid",
    "dep:zip",
]

[dependencies]
browser_manipulation = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
eyre.workspace = true
futures = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
image.workspace = true
jiff.workspace = true
kamadak-exif.workspace = true
libwebp.workspace = true
miette.workspace = true
playwright-rs = { workspace = true, optional = true }
reqwest.workspace = true
review_archive_core.workspace = true
sa_alerts = { workspace = true, optional = true }
sa_places = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smart-default.workspace = true
sqlx = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "rt", "macros", "net"] }
tracing.workspace = true
tracing-error.workspace = true
uuid = { workspace = true, optional = true }
v_utils = { workspace = true, features = ["memory_lease"] } # tokio/net, which the wasm crates cannot build
zip = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
miette = { workspace = true, features = ["fancy"] }
png.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true # the examples print the walk's log

[lints]
workspace = true
